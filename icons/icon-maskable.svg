<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Full-bleed background (safe zone = inner 80% = 102..410) -->
  <rect width="512" height="512" fill="#059669"/>

  <!-- Store body (shifted inward for maskable safe zone) -->
  <rect x="128" y="196" width="256" height="144" rx="4" fill="#ffffff" opacity="0.15"/>
  <rect x="128" y="196" width="256" height="144" rx="4" fill="none" stroke="#ffffff" stroke-width="6"/>

  <!-- Awning -->
  <rect x="112" y="170" width="288" height="26" rx="5" fill="#ffffff"/>

  <!-- Door -->
  <rect x="224" y="272" width="64" height="68" rx="5" fill="#ffffff" opacity="0.9"/>
  <circle cx="282" cy="308" r="5" fill="#059669"/>

  <!-- Left window -->
  <rect x="144" y="214" width="60" height="46" rx="5" fill="#ffffff" opacity="0.9"/>
  <line x1="174" y1="214" x2="174" y2="260" stroke="#059669" stroke-width="3"/>
  <line x1="144" y1="237" x2="204" y2="237" stroke="#059669" stroke-width="3"/>

  <!-- Right window -->
  <rect x="308" y="214" width="60" height="46" rx="5" fill="#ffffff" opacity="0.9"/>
  <line x1="338" y1="214" x2="338" y2="260" stroke="#059669" stroke-width="3"/>
  <line x1="308" y1="237" x2="368" y2="237" stroke="#059669" stroke-width="3"/>

  <!-- Ground -->
  <rect x="112" y="336" width="288" height="14" rx="4" fill="#ffffff" opacity="0.4"/>

  <!-- Sol badge -->
  <circle cx="376" cy="130" r="46" fill="#f59e0b"/>
  <circle cx="376" cy="130" r="38" fill="#fbbf24"/>
  <text x="376" y="143" font-family="Arial,sans-serif" font-size="36" font-weight="900"
        text-anchor="middle" fill="#92400e">S/</text>
</svg>
