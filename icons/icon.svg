<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="#059669"/>

  <!-- Store / shop front -->
  <!-- Roof / awning -->
  <rect x="96" y="168" width="320" height="40" rx="8" fill="#ffffff" opacity="0.25"/>
  <rect x="80" y="160" width="352" height="28" rx="6" fill="#ffffff"/>

  <!-- Store body -->
  <rect x="112" y="188" width="288" height="160" rx="4" fill="#ffffff" opacity="0.15"/>
  <rect x="112" y="188" width="288" height="160" rx="4" fill="none" stroke="#ffffff" stroke-width="6"/>

  <!-- Door -->
  <rect x="216" y="268" width="80" height="80" rx="6" fill="#ffffff" opacity="0.9"/>
  <circle cx="288" cy="310" r="6" fill="#059669"/>

  <!-- Left window -->
  <rect x="130" y="210" width="68" height="56" rx="6" fill="#ffffff" opacity="0.9"/>
  <!-- window cross -->
  <line x1="164" y1="210" x2="164" y2="266" stroke="#059669" stroke-width="3"/>
  <line x1="130" y1="238" x2="198" y2="238" stroke="#059669" stroke-width="3"/>

  <!-- Right window -->
  <rect x="314" y="210" width="68" height="56" rx="6" fill="#ffffff" opacity="0.9"/>
  <line x1="348" y1="210" x2="348" y2="266" stroke="#059669" stroke-width="3"/>
  <line x1="314" y1="238" x2="382" y2="238" stroke="#059669" stroke-width="3"/>

  <!-- Ground / step -->
  <rect x="80" y="344" width="352" height="16" rx="4" fill="#ffffff" opacity="0.4"/>

  <!-- Sol coin (S/.) badge — top-right -->
  <circle cx="388" cy="124" r="52" fill="#f59e0b"/>
  <circle cx="388" cy="124" r="44" fill="#fbbf24"/>
  <text x="388" y="136" font-family="Arial,sans-serif" font-size="42" font-weight="900"
        text-anchor="middle" fill="#92400e">S/</text>
</svg>
